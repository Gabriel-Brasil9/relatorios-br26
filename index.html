<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Arquivo BR26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bf7'/%3E%3Ccircle cx='22' cy='22' r='7' fill='%23ffcf3d'/%3E%3Crect x='7' y='7' width='11' height='11' rx='3' fill='%23ff8ac4'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#f4f4fa; --card:#ffffff; --ink:#17172b; --ink-2:#4d4d66; --ink-3:#7c7c95;
  --line:#e3e3ef; --field:#ffffff; --hover:#ebebf6; --focus:#5b5bf7; --danger:#d6334a;
  --brand:#5b5bf7; --brand-ink:#ffffff;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --lift:0 2px 4px rgba(23,23,43,.04),0 12px 32px -8px rgba(23,23,43,.14);
  /* cores das categorias: forma (saturada) e capa (clara) */
  --c1:#5b5bf7; --c2:#ff7a2f; --c3:#e8435a; --c4:#10a77a; --c5:#2f7ced; --c6:#a24ff0; --c7:#e2a400; --c8:#ee4f9c;
  --mix:#ffffff; --tint:80%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121220; --card:#1b1b2c; --ink:#f1f1fa; --ink-2:#bdbdd3; --ink-3:#8a8aa6;
    --line:#2b2b42; --field:#1b1b2c; --hover:#23233a; --focus:#8f8fff; --danger:#ff7085;
    --brand:#7b7bff; --lift:0 2px 4px rgba(0,0,0,.25),0 12px 32px -8px rgba(0,0,0,.6);
    --mix:#1b1b2c; --tint:72%;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121220; --card:#1b1b2c; --ink:#f1f1fa; --ink-2:#bdbdd3; --ink-3:#8a8aa6;
  --line:#2b2b42; --field:#1b1b2c; --hover:#23233a; --focus:#8f8fff; --danger:#ff7085;
  --brand:#7b7bff; --lift:0 2px 4px rgba(0,0,0,.25),0 12px 32px -8px rgba(0,0,0,.6);
  --mix:#1b1b2c; --tint:72%;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* categorias */
[data-c="panoramas"]{--c:var(--c1)} [data-c="clipping"]{--c:var(--c2)} [data-c="pautas"]{--c:var(--c3)} [data-c="frentes"]{--c:var(--c4)}
[data-c="adversarios"]{--c:var(--c5)} [data-c="momentos"]{--c:var(--c6)} [data-c="exercito"]{--c:var(--c7)} [data-c="conteudos"]{--c:var(--c8)}
[data-c]{--soft:color-mix(in srgb, var(--c) calc(100% - var(--tint)), var(--mix))}

/* ---------- login ---------- */
.gate{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.gate-art{position:relative;overflow:hidden;background:var(--brand)}
.gate-art i{position:absolute;display:block}
.gate-art .a{width:46%;aspect-ratio:1;border-radius:50%;background:#ffcf3d;right:-8%;top:10%}
.gate-art .b{width:38%;aspect-ratio:1;border-radius:28px;background:#ff8ac4;left:12%;top:26%;transform:rotate(-12deg)}
.gate-art .c{width:70%;height:22%;border-radius:999px;background:#12c48f;left:-14%;bottom:12%;transform:rotate(8deg)}
.gate-art .d{width:22%;aspect-ratio:1;border-radius:50%;border:18px solid #fff;right:18%;bottom:24%}
.gate-art .e{width:34%;height:9%;background:repeating-linear-gradient(90deg,#17172b 0 14px,transparent 14px 26px);left:10%;top:9%;opacity:.85}
.gate-art p{position:absolute;left:8%;bottom:6%;margin:0;color:#fff;font:700 15px var(--sans);opacity:.9}
.gate-side{display:grid;place-items:center;padding:32px 20px}
.gate-card{width:100%;max-width:380px}
.gate h1{font:800 clamp(40px,5vw,56px)/.98 var(--display);letter-spacing:-.03em;margin:0 0 12px}
.gate .lede{color:var(--ink-2);margin:0 0 28px;font-size:17px}
.field{position:relative}
.field input{width:100%;height:56px;padding:0 54px 0 20px;border:2px solid var(--line);border-radius:16px;background:var(--field);font-size:17px;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--brand)}
.peek{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.peek:hover{color:var(--ink);background:var(--hover)}
.remember{display:flex;align-items:center;gap:10px;margin:16px 0 22px;color:var(--ink-2);font-size:15px;cursor:pointer;user-select:none}
.remember input{width:18px;height:18px;accent-color:var(--brand);margin:0}
.go{width:100%;height:56px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);font:700 17px var(--sans);cursor:pointer;transition:transform .12s, filter .15s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.98)}
.go[disabled]{opacity:.7;cursor:progress}
.err{color:var(--danger);font-weight:600;font-size:15px;min-height:22px;margin-top:14px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (max-width:820px){
  .gate{grid-template-columns:1fr;grid-template-rows:180px 1fr}
  .gate-art p{display:none}
  .gate-side{align-items:start;padding-top:36px}
}

/* ---------- app ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
@media (max-width:560px){.wrap{padding:0 16px}}
.top{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:10px;font:800 19px var(--display);letter-spacing:-.01em;text-decoration:none}
.logo svg{flex:none}
.ghost{border:0;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);height:40px;padding:0 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.ghost:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-3)}

.hero{padding:36px 0 28px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px}
.hero h1{font:800 clamp(44px,7.4vw,92px)/.92 var(--display);letter-spacing:-.045em;margin:0;max-width:11ch}
.tally{display:flex;gap:12px}
.tally div{background:var(--card);border-radius:20px;padding:14px 18px;min-width:118px;box-shadow:inset 0 0 0 1.5px var(--line)}
.tally b{display:block;font:800 34px/1 var(--display);letter-spacing:-.03em}
.tally span{font-size:14px;color:var(--ink-2)}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:20px 0 22px}.tally div{min-width:0;flex:1}}

.search{position:relative}
.search svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:64px;padding:0 56px 0 56px;border:2px solid transparent;border-radius:999px;background:var(--card);font-size:18px;box-shadow:var(--lift);transition:border-color .15s}
.search input:focus{outline:none;border-color:var(--brand)}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.search kbd,.search .clear{position:absolute;right:16px;top:50%;transform:translateY(-50%)}
.search kbd{font:600 13px var(--sans);color:var(--ink-3);background:var(--bg);border-radius:8px;padding:3px 9px}
.search .clear{border:0;background:var(--hover);width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--ink-2);display:grid;place-items:center}
@media (hover:none){.search kbd{display:none}}
@media (max-width:560px){.search input{height:56px;font-size:16px;padding:0 50px}.search svg{left:18px}}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 0}
@media (max-width:760px){.chips{flex-wrap:nowrap;overflow-x:auto;margin:16px -16px 0;padding:2px 16px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 12px;border:0;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-weight:600;font-size:15px;color:var(--ink);transition:background .15s, box-shadow .15s}
.chip .dot{width:14px;height:14px;border-radius:50%;background:var(--c,var(--ink))}
.chip .n{font-size:13px;font-weight:600;color:var(--ink-3)}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--c,var(--ink-3))}
.chip[aria-pressed="true"]{background:var(--soft,var(--ink));box-shadow:inset 0 0 0 2px var(--c,var(--ink))}
.chip[data-c="todas"][aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.chip[data-c="todas"] .dot{background:conic-gradient(var(--c1) 0 12.5%,var(--c2) 0 25%,var(--c3) 0 37.5%,var(--c4) 0 50%,var(--c5) 0 62.5%,var(--c6) 0 75%,var(--c7) 0 87.5%,var(--c8) 0)}
.chip[data-c="todas"][aria-pressed="true"] .n{color:inherit;opacity:.6}

.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:26px 0 4px;min-height:40px}
.bar .desc{color:var(--ink-2);font-size:15px;max-width:70ch}
.sort{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer;padding:8px 12px;margin-right:-12px;border-radius:999px}
.sort:hover{background:var(--hover);color:var(--ink)}

.month{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
.month h2{font:800 28px/1 var(--display);letter-spacing:-.025em;margin:0}
.month span{font-size:13px;font-weight:700;color:var(--ink-2);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:3px 10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;list-style:none;margin:0;padding:0}
@media (max-width:560px){.grid{grid-template-columns:1fr;gap:14px}}
.card a{display:flex;flex-direction:column;height:100%;background:var(--card);border-radius:24px;text-decoration:none;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .18s ease, box-shadow .18s ease}
@media (hover:hover){.card a:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1.5px transparent,var(--lift)}}
.cover{position:relative;overflow:hidden;background:var(--soft);padding:20px 22px 22px;min-height:168px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;isolation:isolate}
.cover::before,.cover::after{content:"";position:absolute;z-index:-1}
.cover h3{font:750 23px/1.12 var(--display);letter-spacing:-.02em;margin:0;max-width:68%;text-wrap:balance}
.tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--card);color:var(--ink)}
.tag.cat{background:var(--c);color:#fff}
[data-c="exercito"] .tag.cat{color:#17172b}
.body{padding:16px 22px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.body p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.5}
.when{margin-top:auto;font-size:13.5px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.when svg{flex:none}

/* formas de capa, uma por categoria: ficam no terço direito, longe do título */
[data-c="panoramas"] .cover::before{width:160px;height:160px;border-radius:50%;background:var(--c);right:-62px;bottom:-66px;opacity:.9}
[data-c="panoramas"] .cover::after{width:44px;height:44px;border-radius:50%;border:9px solid var(--c);right:18px;top:58px;opacity:.55}
[data-c="clipping"] .cover::before{width:104px;height:130px;right:-14px;bottom:-22px;background:repeating-linear-gradient(0deg,var(--c) 0 11px,transparent 11px 22px);transform:rotate(-8deg);opacity:.85}
[data-c="pautas"] .cover::before{width:140px;height:140px;right:-74px;bottom:-62px;background:var(--c);transform:rotate(45deg);border-radius:26px;opacity:.9}
[data-c="pautas"] .cover::after{width:24px;height:24px;border-radius:50%;background:var(--c);right:28px;top:62px;opacity:.6}
[data-c="frentes"] .cover::before{width:118px;height:40px;border-radius:999px;background:var(--c);right:-38px;bottom:56px;opacity:.85}
[data-c="frentes"] .cover::after{width:88px;height:40px;border-radius:999px;background:var(--c);right:-22px;bottom:8px;opacity:.5}
[data-c="adversarios"] .cover::before{width:140px;height:140px;border-radius:50%;border:24px solid var(--c);right:-64px;bottom:-58px;opacity:.85}
[data-c="momentos"] .cover::before{width:96px;height:96px;right:-12px;bottom:-16px;background:var(--c);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.85}
[data-c="momentos"] .cover::after{width:32px;height:32px;right:24px;top:56px;background:var(--c);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.5}
[data-c="exercito"] .cover::before{width:96px;height:120px;right:-12px;bottom:-26px;background:radial-gradient(circle,var(--c) 6px,transparent 7px) 0 0/24px 24px;opacity:.9}
[data-c="conteudos"] .cover::before{width:132px;height:118px;right:-56px;bottom:-44px;background:var(--c);border-radius:62% 38% 46% 54%/55% 48% 52% 45%;transform:rotate(-14deg);opacity:.9}
[data-c="conteudos"] .cover::after{width:30px;height:30px;right:26px;top:58px;background:var(--c);border-radius:50%;opacity:.5}

.empty{padding:64px 16px;text-align:center}
.empty h2{font:800 30px var(--display);letter-spacing:-.02em;margin:0 0 8px}
.empty p{color:var(--ink-2);margin:0 0 20px}
.foot{padding:72px 0 44px;color:var(--ink-3);font-size:14px;display:flex;align-items:center;gap:8px}

/* ---------- leitor ---------- */
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:rin .2s ease}
@keyframes rin{from{opacity:0;transform:translateY(12px)}}
.rbar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--card);box-shadow:0 1.5px 0 var(--line)}
.back{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.back:hover{background:var(--hover)}
.rtitle{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rtitle strong{font:750 19px/1.2 var(--display);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle .tags{flex-wrap:nowrap;overflow:hidden}
.rtitle .tag{font-size:12px;padding:2px 9px;background:var(--bg)}
.rtitle .tag.cat{background:var(--c)}
.ractions{flex:none;display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--bg);cursor:pointer;font-weight:700;font-size:14.5px;white-space:nowrap}
.pill:hover{background:var(--hover)}
.pill.solid{background:var(--brand);color:var(--brand-ink)}
.pill.solid:hover{filter:brightness(1.08)}
@media (max-width:680px){
  .ractions .lbl{display:none}.pill{width:44px;padding:0;justify-content:center}
  .rtitle strong{font-size:16px}.rtitle .tag:not(.cat){display:none}
}
.rbody{flex:1;position:relative;min-height:0}
.rbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.state{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.state h2{font:800 28px/1.1 var(--display);letter-spacing:-.02em;margin:0 0 8px;color:var(--ink);max-width:18ch;margin-inline:auto}
.state p{margin:0 0 22px}
.state .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.state .pill{width:auto;padding:0 20px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.state .pill.solid{background:var(--brand);box-shadow:none}
.loader{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.loader i{width:14px;height:14px;border-radius:50%;background:var(--c1);animation:hop .9s ease-in-out infinite}
.loader i:nth-child(2){background:var(--c7);animation-delay:.12s}
.loader i:nth-child(3){background:var(--c8);animation-delay:.24s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
body.locked{overflow:hidden}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.lang button{border:0;background:none;height:34px;min-width:44px;padding:0 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--ink-3);letter-spacing:.02em}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.top .right{display:flex;align-items:center;gap:10px}
.gate-side{position:relative}
.gate-lang{position:absolute;top:20px;right:20px}
.rtitle .tag.warn{background:#ffe9a8;color:#5a4300}
</style>
</head>
<body>

<!-- Tela de senha -->
<main class="gate" id="gate" hidden>
  <div class="gate-art" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="e"></i><p>Eleições 2026</p></div>
  <div class="gate-side">
    <div class="lang gate-lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button></div>
    <form class="gate-card" id="loginForm" autocomplete="on">
      <h1>Arquivo BR26</h1>
      <p class="lede" data-i18n="gateLede">Todos os relatórios da campanha num lugar só. Digite a senha para entrar.</p>
      <input type="text" name="username" value="arquivo" autocomplete="username" hidden>
      <label class="sr" for="pw" data-i18n="pw">Senha</label>
      <div class="field">
        <input id="pw" type="password" autocomplete="current-password" placeholder="Senha" data-i18n-ph="pw" required autofocus>
        <button type="button" class="peek" id="peek" aria-label="Mostrar senha" data-i18n-aria="peek">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label class="remember"><input type="checkbox" id="remember"> <span data-i18n="remember">Manter conectado neste aparelho</span></label>
      <button class="go" id="enter" type="submit" data-i18n="enter">Entrar</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>
</main>

<!-- Arquivo -->
<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <a class="logo" href="#" id="home">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5b5bf7"/><circle cx="22" cy="22" r="7" fill="#ffcf3d"/><rect x="7" y="7" width="11" height="11" rx="3" fill="#ff8ac4"/></svg>
        Arquivo BR26
      </a>
      <div class="right"><div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button></div><button class="ghost" id="logout" type="button" data-i18n="logout">Sair</button></div>
    </header>

    <section class="hero">
      <h1 id="title">Relatórios da campanha</h1>
      <div class="tally" id="tally"></div>
    </section>

    <div class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q" data-i18n="searchLabel">Buscar relatórios</label>
      <input id="q" type="search" placeholder="Buscar por tema, nome ou palavra" data-i18n-ph="search" autocomplete="off" spellcheck="false">
      <kbd id="kbd">/</kbd>
      <button class="clear" id="clear" type="button" aria-label="Limpar busca" data-i18n-aria="clear" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <nav class="chips" id="chips" aria-label="Categorias"></nav>

    <div class="bar">
      <div class="desc" id="desc" aria-live="polite"></div>
      <button class="sort" id="sort" type="button"></button>
    </div>

    <main id="results"></main>

    <footer class="foot">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span data-i18n="foot">Conteúdo criptografado. Só abre com a senha.</span>
    </footer>
  </div>
</div>

<!-- Leitor -->
<section class="reader" id="reader" hidden aria-modal="true" role="dialog" aria-labelledby="rTitle">
  <div class="rbar" id="rBar">
    <button class="back" id="back" type="button" aria-label="Voltar para a lista" data-i18n-aria="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="rtitle"><strong id="rTitle"></strong><div class="tags" id="rTags"></div></div>
    <div class="ractions">
      <button class="pill" id="rOpen" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        <span class="lbl" data-i18n="newTab">Nova aba</span>
      </button>
      <button class="pill solid" id="rDown" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span class="lbl">Baixar</span>
      </button>
    </div>
  </div>
  <div class="rbody" id="rBody"></div>
</section>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const KEY_SLOT = "arquivo-chave";
const LANG_SLOT = "arquivo-idioma";
const I18N = {
  pt: {
    months:["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],
    monthHead:(m,y)=>m.charAt(0).toUpperCase()+m.slice(1)+" de "+y,
    gateLede:"Todos os relatórios da campanha num lugar só. Digite a senha para entrar.",
    pw:"Senha", peek:"Mostrar senha", remember:"Manter conectado neste aparelho", enter:"Entrar", checking:"Verificando…",
    wrong:"Senha incorreta. Confira e tente de novo.", loadFail:"Não foi possível carregar o arquivo. Recarregue a página.",
    oldBrowser:"Este navegador não é compatível. Use uma versão recente de Chrome, Safari, Edge ou Firefox.",
    logout:"Sair", searchLabel:"Buscar relatórios", search:"Buscar por tema, nome ou palavra", clear:"Limpar busca",
    foot:"Conteúdo criptografado. Só abre com a senha.", back:"Voltar para a lista", newTab:"Nova aba", download:"Baixar", downloadPptx:"Baixar PPTX",
    all:"Todos", reports:n=>n===1?"relatório":"relatórios", found:n=>n===1?"relatório encontrado":"relatórios encontrados",
    themes:"temas", months_:n=>n===1?"mês":"meses",
    newest:"Mais recentes primeiro", oldest:"Mais antigos primeiro",
    emptyH:"Nada por aqui", emptyP:(q,c)=>"Nenhum relatório"+(q?" com “"+q+"”":"")+(c?" em "+c:"")+". Tente outra palavra ou veja todos.", emptyBtn:"Ver todos os relatórios",
    pages:(n,f)=>f==="pptx"?n+" slides":n+(n===1?" página":" páginas"),
    opening:"Abrindo o relatório", noView:"Este arquivo não abre no navegador. Baixe para ver.", openPdf:"Abrir PDF",
    failH:"O relatório não abriu", failP:"A conexão pode ter caído no meio do caminho.", retry:"Tentar de novo",
    onlyPt:"", onlyEn:"Em inglês", appTitle:"Arquivo BR26"
  },
  en: {
    months:["January","February","March","April","May","June","July","August","September","October","November","December"],
    monthHead:(m,y)=>m+" "+y,
    gateLede:"All the campaign reports in one place. Enter the password to sign in.",
    pw:"Password", peek:"Show password", remember:"Keep me signed in on this device", enter:"Sign in", checking:"Checking…",
    wrong:"Wrong password. Check it and try again.", loadFail:"The archive did not load. Reload the page.",
    oldBrowser:"This browser is not supported. Use a recent version of Chrome, Safari, Edge or Firefox.",
    logout:"Sign out", searchLabel:"Search reports", search:"Search by topic, name or keyword", clear:"Clear search",
    foot:"Encrypted content. It only opens with the password.", back:"Back to the list", newTab:"New tab", download:"Download", downloadPptx:"Download PPTX",
    all:"All", reports:n=>n===1?"report":"reports", found:n=>n===1?"report found":"reports found",
    themes:"topics", months_:n=>n===1?"month":"months",
    newest:"Newest first", oldest:"Oldest first",
    emptyH:"Nothing here", emptyP:(q,c)=>"No reports"+(q?" matching “"+q+"”":"")+(c?" in "+c:"")+". Try another word or see them all.", emptyBtn:"See all reports",
    pages:(n,f)=>f==="pptx"?n+" slides":n+(n===1?" page":" pages"),
    opening:"Opening the report", noView:"This file does not open in the browser. Download it to view.", openPdf:"Open PDF",
    failH:"The report did not open", failP:"The connection may have dropped along the way.", retry:"Try again",
    onlyPt:"Portuguese only for now", onlyEn:"", appTitle:"BR26 Archive"
  }
};
let lang = "pt";
try { const l = localStorage.getItem(LANG_SLOT); if (l === "en" || l === "pt") lang = l; } catch(e){}
const T = k => I18N[lang][k];
const FMT = {html:"HTML", pdf:"PDF", pptx:"PPTX", xlsx:"XLSX"};
const CAL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';

let key = null, meta = null, catalog = null, current = null;
let state = {cat:"todas", q:"", newest:true};
const blobCache = new Map();

function applyStatic(){
  document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", T(el.dataset.i18nAria)));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelector(".logo").lastChild.textContent = " " + T("appTitle");
  $("gate").querySelector("h1").textContent = T("appTitle");
}
function setLang(l){
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem(LANG_SLOT, l); } catch(e){}
  applyStatic();
  if (!$("gate").hidden) { if ($("err").textContent) $("err").textContent = ""; return; }
  if (catalog) { startApp(true); if (current) openReader(current); }
}
document.addEventListener("click", e => { const b = e.target.closest(".lang button"); if (b) setLang(b.dataset.lang); });

/* ---------- armazenamento (pode falhar em modo privado) ---------- */
const store = {
  get(){ for (const s of [sessionStorage, localStorage]) { try { const v = s.getItem(KEY_SLOT); if (v) return v; } catch(e){} } return null; },
  set(v, persist){ try { sessionStorage.setItem(KEY_SLOT, v); } catch(e){} if (persist) { try { localStorage.setItem(KEY_SLOT, v); } catch(e){} } },
  clear(){ for (const s of [sessionStorage, localStorage]) { try { s.removeItem(KEY_SLOT); } catch(e){} } }
};

/* ---------- criptografia ---------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));

async function deriveKey(password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(meta.salt), iterations:meta.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decrypt(buf){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, key, buf.slice(12));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).arrayBuffer();
}
async function fetchBin(name, fresh){
  const r = await fetch("d/" + name + ".bin", {cache: fresh ? "no-cache" : "default"});
  if (!r.ok) throw new Error("http " + r.status);
  return r.arrayBuffer();
}
async function loadCatalog(){
  const raw = await decrypt(await fetchBin("c", true));
  catalog = JSON.parse(new TextDecoder().decode(raw));
}

/* ---------- entrada ---------- */
async function boot(){
  try { meta = await (await fetch("d/meta.json", {cache:"no-cache"})).json(); }
  catch(e){ showGate(T("loadFail")); return; }
  const saved = store.get();
  if (saved) {
    try {
      key = await crypto.subtle.importKey("raw", b64d(saved), {name:"AES-GCM"}, true, ["decrypt"]);
      await loadCatalog();
      return startApp();
    } catch(e){ store.clear(); key = null; }
  }
  showGate();
}
function showGate(msg){
  $("app").hidden = true; $("reader").hidden = true; $("gate").hidden = false;
  $("err").textContent = msg || "";
  setTimeout(() => $("pw").focus(), 30);
}
$("peek").onclick = () => { const i = $("pw"); i.type = i.type === "password" ? "text" : "password"; i.focus(); };
$("loginForm").onsubmit = async ev => {
  ev.preventDefault();
  const pw = $("pw").value; if (!pw) return;
  $("enter").disabled = true; $("enter").textContent = T("checking"); $("err").textContent = "";
  try {
    key = await deriveKey(pw);
    await loadCatalog();
    store.set(b64e(await crypto.subtle.exportKey("raw", key)), $("remember").checked);
    $("pw").value = "";
    startApp();
  } catch(e){
    key = null;
    $("err").textContent = T("wrong");
    const f = $("loginForm"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    $("pw").select();
  } finally {
    $("enter").disabled = false; $("enter").textContent = T("enter");
  }
};
$("logout").onclick = () => { store.clear(); key = null; catalog = null; blobCache.forEach(u => URL.revokeObjectURL(u)); blobCache.clear(); history.replaceState(null, "", location.pathname); showGate(); };
$("home").onclick = e => { e.preventDefault(); state.cat = "todas"; state.q = ""; $("q").value = ""; syncSearch(); renderChips(); render(); scrollTo({top:0, behavior:"smooth"}); };

/* ---------- lista ---------- */
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const catOf = id => { const c = catalog.categorias.find(c => c.id === id) || {id, nome:id}; return lang === "en" && c.en ? {...c, ...c.en} : c; };
const tx = (r, f) => (lang === "en" && r.en && r.en[f]) || r[f] || "";
const hasEn = r => !!r.ver_en;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, a, b) => n + " " + (n === 1 ? a : b);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function pages(r){ return r.pag ? T("pages")(r.pag, r.fmt) : ""; }
function fmtTag(r){ const f = FMT[r.fmt] || (r.fmt || "").toUpperCase(); return r.pag ? f + ", " + pages(r) : f; }

function startApp(rerender){
  $("gate").hidden = true; $("app").hidden = false;
  applyStatic();
  if (!current) document.title = T("appTitle");
  $("title").textContent = (lang === "en" && catalog.titulo_en) || catalog.titulo || "Relatórios";
  const all = catalog.relatorios;
  const months = new Set(all.map(r => r.data.slice(0,7))).size;
  $("tally").innerHTML = `<div><b>${all.length}</b><span>${T("reports")(all.length)}</span></div><div><b>${catalog.categorias.length}</b><span>${T("themes")}</span></div><div><b>${months}</b><span>${T("months_")(months)}</span></div>`;
  renderChips(); render(); if (!rerender) route();
}

function filtered(){
  const words = norm(state.q).split(/\s+/).filter(Boolean);
  return catalog.relatorios.filter(r => {
    if (state.cat !== "todas" && r.cat !== state.cat) return false;
    if (!words.length) return true;
    const c = catalog.categorias.find(x => x.id === r.cat) || {};
    const hay = norm([r.titulo, r.resumo, r.periodo, r.en && r.en.titulo, r.en && r.en.resumo, c.nome, c.en && c.en.nome, r.nome].join(" "));
    return words.every(w => hay.includes(w));
  }).sort((a, b) => (state.newest ? -1 : 1) * (a.data.localeCompare(b.data) || a.titulo.localeCompare(b.titulo)));
}

function renderChips(){
  const counts = {}; catalog.relatorios.forEach(r => counts[r.cat] = (counts[r.cat] || 0) + 1);
  const items = [{id:"todas", nome:T("all"), n:catalog.relatorios.length}, ...catalog.categorias.map(c => ({...catOf(c.id), n:counts[c.id] || 0}))];
  $("chips").innerHTML = items.filter(c => c.n).map(c =>
    `<button class="chip" type="button" data-c="${esc(c.id)}" aria-pressed="${c.id === state.cat}"><span class="dot"></span>${esc(c.nome)}<span class="n">${c.n}</span></button>`).join("");
}
$("chips").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.cat = b.dataset.c;
  $("chips").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
};

function card(r){
  const c = catOf(r.cat);
  return `<li class="card" data-c="${esc(r.cat)}"><a href="#/r/${esc(r.id)}">
    <div class="cover">
      <div class="tags"><span class="tag cat">${esc(c.nome)}</span><span class="tag">${esc(fmtTag(r))}</span></div>
      <h3>${esc(tx(r, "titulo"))}</h3>
    </div>
    <div class="body">
      ${tx(r, "resumo") ? `<p>${esc(tx(r, "resumo"))}</p>` : ""}
      ${tx(r, "periodo") ? `<div class="when">${CAL}${esc(tx(r, "periodo"))}</div>` : ""}
    </div>
  </a></li>`;
}

function render(){
  const list = filtered();
  const cat = state.cat !== "todas" ? catOf(state.cat) : null;
  const count = list.length + " " + (state.q ? T("found") : T("reports"))(list.length);
  $("desc").textContent = (cat && cat.desc ? cat.desc + " " : "") + cap(count) + ".";
  $("sort").innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>' +
    (state.newest ? T("newest") : T("oldest"));
  if (!list.length) {
    $("results").innerHTML = `<div class="empty"><h2>${T("emptyH")}</h2><p>${T("emptyP")(esc(state.q), cat ? esc(cat.nome) : "")}</p><button class="pill solid" type="button" id="reset" style="margin:auto">${T("emptyBtn")}</button></div>`;
    $("reset").onclick = () => { state.q = ""; state.cat = "todas"; $("q").value = ""; syncSearch(); renderChips(); render(); };
    return;
  }
  const groups = [];
  list.forEach(r => { const k = r.data.slice(0,7); let g = groups[groups.length-1]; if (!g || g.k !== k) groups.push(g = {k, items:[]}); g.items.push(r); });
  $("results").innerHTML = groups.map(g => `
    <section>
      <div class="month"><h2>${T("monthHead")(T("months")[+g.k.slice(5,7)-1], g.k.slice(0,4))}</h2><span>${g.items.length}</span></div>
      <ul class="grid">${g.items.map(card).join("")}</ul>
    </section>`).join("");
}
$("sort").onclick = () => { state.newest = !state.newest; render(); };
function syncSearch(){ $("clear").hidden = !$("q").value; $("kbd").hidden = !!$("q").value; }
$("q").oninput = () => { state.q = $("q").value; syncSearch(); render(); };
$("clear").onclick = () => { $("q").value = ""; state.q = ""; syncSearch(); render(); $("q").focus(); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && !$("app").hidden && $("reader").hidden && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && !$("reader").hidden) closeReader();
});

/* ---------- leitor ---------- */
let cameFromList = false;
window.addEventListener("hashchange", () => { cameFromList = true; route(); });
function route(){
  if (!catalog) return;
  const m = location.hash.match(/^#\/r\/([\w-]+)/);
  const r = m && catalog.relatorios.find(x => x.id === m[1]);
  if (r) openReader(r); else hideReader();
}
function closeReader(){ if (cameFromList && history.length > 1) history.back(); else { location.hash = ""; } }
$("back").onclick = closeReader;
window.addEventListener("message", e => { if (e.data === "arquivo:fechar" && !$("reader").hidden) closeReader(); });

async function getBlob(part){
  if (blobCache.has(part.f)) return blobCache.get(part.f);
  const raw = await decrypt(await fetchBin(part.f));
  const url = URL.createObjectURL(new Blob([raw], {type: part.mime}));
  blobCache.set(part.f, url);
  return url;
}
function stateBox(html){ $("rBody").innerHTML = `<div class="state"><div>${html}</div></div>`; }

const IFRAME_GUARD = `<script>(function(){try{window.localStorage}catch(e){var m={},s={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null},get length(){return Object.keys(m).length}};try{Object.defineProperty(window,"localStorage",{value:s});Object.defineProperty(window,"sessionStorage",{value:s})}catch(e){}}["pushState","replaceState"].forEach(function(n){var f=history[n];history[n]=function(){try{return f.apply(history,arguments)}catch(e){}}});document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href")||"";if(h&&h.charAt(0)!=="#"&&h.indexOf("javascript:")!==0){a.target="_blank";a.rel="noopener"}},true);document.addEventListener("keydown",function(e){if(e.key==="Escape")parent.postMessage("arquivo:fechar","*")})})();<\/script>`;

function canInlinePdf(){
  const small = matchMedia("(pointer:coarse)").matches && innerWidth < 900;
  return navigator.pdfViewerEnabled !== false && !small;
}
const LOADER = '<div class="loader"><i></i><i></i><i></i></div>';

const viewPart = r => (lang === "en" && r.ver_en) || r.ver;
const downPart = r => (lang === "en" && r.baixar_en) || r.baixar || r.ver;
async function openReader(r){
  current = r;
  const c = catOf(r.cat);
  const ver = viewPart(r);
  document.body.classList.add("locked");
  $("reader").hidden = false;
  $("rBar").dataset.c = r.cat;
  $("rTitle").textContent = tx(r, "titulo");
  document.title = tx(r, "titulo");
  const warn = lang === "en" && !hasEn(r) && T("onlyPt");
  $("rTags").innerHTML = `<span class="tag cat">${esc(c.nome)}</span>${warn ? `<span class="tag warn">${esc(warn)}</span>` : ""}${tx(r, "periodo") ? `<span class="tag">${esc(tx(r, "periodo"))}</span>` : ""}<span class="tag">${esc(fmtTag(r))}</span>`;
  $("rOpen").hidden = !ver;
  $("rDown").querySelector(".lbl").textContent = r.fmt === "pptx" ? T("downloadPptx") : T("download");
  const mb = r.tam > 1.5e6 ? " (" + (r.tam/1e6).toFixed(1).replace(".", lang === "en" ? "." : ",") + " MB)" : "";
  stateBox(`${LOADER}${T("opening")}${mb}…`);
  try {
    if (!ver) { stateBox(`<h2>${esc(tx(r, "titulo"))}</h2><p>${T("noView")}</p><div class="row"><button class="pill solid" data-act="down">${T("download")}</button></div>`); return; }
    if (ver.mime === "text/html") {
      const raw = await decrypt(await fetchBin(ver.f));
      if (current !== r) return;
      let html = new TextDecoder().decode(raw);
      html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + IFRAME_GUARD) : IFRAME_GUARD + html;
      const fr = document.createElement("iframe");
      fr.title = tx(r, "titulo");
      fr.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads allow-forms allow-modals");
      fr.srcdoc = html;
      $("rBody").replaceChildren(fr);
    } else if (ver.mime === "application/pdf" && canInlinePdf()) {
      const url = await getBlob(ver);
      if (current !== r) return;
      const fr = document.createElement("iframe");
      fr.title = tx(r, "titulo"); fr.src = url + "#view=FitH";
      $("rBody").replaceChildren(fr);
    } else {
      await getBlob(ver);
      if (current !== r) return;
      stateBox(`<h2>${esc(tx(r, "titulo"))}</h2><p>${esc(fmtTag(r))}</p><div class="row"><button class="pill solid" data-act="open">${T("openPdf")}</button><button class="pill" data-act="down">${T("download")}</button></div>`);
    }
  } catch(e){
    if (current !== r) return;
    stateBox(`<h2>${T("failH")}</h2><p>${T("failP")}</p><div class="row"><button class="pill solid" data-act="retry">${T("retry")}</button></div>`);
  }
}
$("rBody").onclick = e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "open") openNewTab(); else if (act === "down") download(); else if (act === "retry" && current) openReader(current);
};
function hideReader(){
  current = null;
  $("reader").hidden = true; $("rBody").replaceChildren();
  document.body.classList.remove("locked");
  if (catalog) document.title = T("appTitle");
}
async function openNewTab(){
  const ver = current && viewPart(current);
  if (!ver) return;
  const w = window.open("", "_blank");
  try { const url = await getBlob(ver); if (w) w.location.href = url; else location.href = url; }
  catch(e){ if (w) w.close(); }
}
async function download(){
  if (!current) return;
  const part = downPart(current);
  try {
    const url = await getBlob(part);
    const a = document.createElement("a");
    a.href = url; a.download = part.nome || current.nome;
    document.body.appendChild(a); a.click(); a.remove();
