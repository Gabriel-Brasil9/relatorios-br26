<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Arquivo de relatórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316161a'/%3E%3Cpath d='M10 9h9l4 4v10H10z' fill='none' stroke='%23f7f6f2' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M13 17h7M13 20.5h5' stroke='%23f7f6f2' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#f7f6f2; --surface:#ffffff; --ink:#16161a; --ink-2:#55544f; --ink-3:#86847d;
  --line:#e4e2dc; --line-2:#d6d3cb; --hover:#efede7; --accent:#24477a; --danger:#a5301f;
  --chip:#ffffff; --chip-on:#16161a; --chip-on-ink:#f7f6f2; --shadow:0 1px 2px rgba(22,22,26,.04),0 8px 24px rgba(22,22,26,.06);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121212; --surface:#1a1a1a; --ink:#ecebe7; --ink-2:#b4b2ab; --ink-3:#8a8882;
    --line:#2a2a28; --line-2:#3a3a37; --hover:#1f1f1e; --accent:#8fb0e6; --danger:#ec7a66;
    --chip:#1a1a1a; --chip-on:#ecebe7; --chip-on-ink:#121212; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121212; --surface:#1a1a1a; --ink:#ecebe7; --ink-2:#b4b2ab; --ink-3:#8a8882;
  --line:#2a2a28; --line-2:#3a3a37; --hover:#1f1f1e; --accent:#8fb0e6; --danger:#ec7a66;
  --chip:#1a1a1a; --chip-on:#ecebe7; --chip-on-ink:#121212; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- login ---------- */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:100%;max-width:380px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.gate h1{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.08;letter-spacing:-.01em;margin:10px 0 8px}
.gate p.lede{color:var(--ink-2);margin:0 0 28px}
.field{position:relative}
.field input{width:100%;height:48px;padding:0 48px 0 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:16px}
.field input:focus{outline:none;border-color:var(--ink)}
.peek{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.peek:hover{color:var(--ink);background:var(--hover)}
.remember{display:flex;align-items:center;gap:8px;margin:14px 0 20px;color:var(--ink-2);font-size:14px;cursor:pointer;user-select:none}
.remember input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-primary{width:100%;height:48px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink);opacity:.88}
.btn-primary[disabled]{opacity:.6;cursor:progress}
.err{color:var(--danger);font-size:14px;min-height:21px;margin-top:12px}

/* ---------- app ---------- */
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid var(--line)}
.top .kicker{color:var(--ink-2)}
.link{border:0;background:none;padding:6px 8px;margin-right:-8px;border-radius:8px;color:var(--ink-3);cursor:pointer;font-size:14px}
.link:hover{color:var(--ink);background:var(--hover)}
.hero{padding:44px 0 24px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.05;letter-spacing:-.015em;margin:0 0 10px}
.hero p{margin:0;color:var(--ink-2)}
.search{position:relative;margin:4px 0 16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:48px;padding:0 44px 0 42px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:16px}
.search input:focus{outline:none;border-color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search kbd,.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.search kbd{font:500 12px var(--sans);color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px}
.search .clear{border:0;background:none;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.search .clear:hover{background:var(--hover);color:var(--ink)}
@media (hover:none){.search kbd{display:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
@media (min-width:760px){.chips{flex-wrap:wrap;overflow:visible}}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line-2);border-radius:999px;background:var(--chip);cursor:pointer;font-size:14px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.65}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:18px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bar .desc{color:var(--ink-2);font-size:14px}
.sort{flex:none;border:0;background:none;color:var(--ink-3);font-size:13px;cursor:pointer;padding:4px 6px;margin-right:-6px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.sort:hover{color:var(--ink);background:var(--hover)}

.month{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 4px}
.month h2{font-family:var(--serif);font-weight:500;font-style:italic;font-size:22px;margin:0;letter-spacing:-.005em}
.month span{font-size:13px;color:var(--ink-3)}
.list{list-style:none;margin:0;padding:0}
.item a{display:grid;grid-template-columns:1fr auto;gap:4px 24px;padding:18px 14px;margin:0 -14px;border-radius:12px;text-decoration:none;border-bottom:1px solid var(--line)}
.item:last-child a{border-bottom-color:transparent}
@media (hover:hover){.item a:hover{background:var(--hover);border-bottom-color:transparent}}
.item h3{grid-column:1;font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.25;margin:0;letter-spacing:-.005em}
.item p{grid-column:1;margin:2px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.5;max-width:62ch}
.item .meta{grid-column:1;margin-top:8px;font-size:12.5px;color:var(--ink-3);white-space:pre-wrap}
.item .fmt{grid-column:2;grid-row:1/span 3;align-self:start;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:3px 7px;margin-top:4px}
@media (max-width:560px){
  .hero{padding:32px 0 18px}.hero h1{font-size:36px}
  .item a{grid-template-columns:1fr;padding:16px 12px;margin:0 -12px}
  .item .fmt{display:none}
  .item h3{font-size:19px}
}
.empty{padding:56px 0;text-align:center;color:var(--ink-2)}
.empty .btn{margin-top:14px;height:38px}
.foot{padding:56px 0 40px;color:var(--ink-3);font-size:12.5px}

/* ---------- leitor ---------- */
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.rbar{flex:none;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px 8px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.back{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 8px;border:0;border-radius:10px;background:none;cursor:pointer;color:var(--ink-2);font-size:14px}
.back:hover{background:var(--hover);color:var(--ink)}
.rtitle{flex:1;min-width:0}
.rtitle strong{display:block;font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle small{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ractions{flex:none;display:flex;gap:8px}
.ractions .btn{height:38px;padding:0 13px;font-size:14px}
@media (max-width:640px){
  .back .lbl,.ractions .lbl{display:none}
  .back{padding:0 8px}.ractions .btn{width:40px;padding:0}
  .rtitle strong{font-size:16px}
}
.rbody{flex:1;position:relative;min-height:0}
.rbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.state{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.state h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 6px;color:var(--ink)}
.state p{margin:0 0 18px}
.state .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spin{width:22px;height:22px;border:2px solid var(--line-2);border-top-color:var(--ink);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
body.locked{overflow:hidden}
</style>
</head>
<body>

<!-- Tela de senha -->
<main class="gate" id="gate" hidden>
  <form class="gate-card" id="loginForm" autocomplete="on">
    <div class="kicker">BR26 · Acesso restrito</div>
    <h1>Arquivo de relatórios</h1>
    <p class="lede">Digite a senha para abrir os relatórios.</p>
    <input type="text" name="username" value="arquivo" autocomplete="username" hidden>
    <label class="sr" for="pw">Senha</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Senha" required autofocus>
      <button type="button" class="peek" id="peek" aria-label="Mostrar senha">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <label class="remember"><input type="checkbox" id="remember"> Manter conectado neste aparelho</label>
    <button class="btn btn-primary" id="enter" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

<!-- Arquivo -->
<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <div class="kicker">BR26 · Arquivo</div>
      <button class="link" id="logout" type="button">Sair</button>
    </header>

    <section class="hero">
      <h1 id="title">Relatórios da campanha</h1>
      <p id="sub"></p>
    </section>

    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">Buscar</label>
      <input id="q" type="search" placeholder="Buscar por tema, nome ou palavra" autocomplete="off" spellcheck="false">
      <kbd id="kbd">/</kbd>
      <button class="clear" id="clear" type="button" aria-label="Limpar busca" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <nav class="chips" id="chips" aria-label="Categorias"></nav>

    <div class="bar">
      <div class="desc" id="desc"></div>
      <button class="sort" id="sort" type="button"></button>
    </div>

    <main id="results"></main>

    <footer class="foot">Conteúdo criptografado. Só abre com a senha.</footer>
  </div>
</div>

<!-- Leitor -->
<section class="reader" id="reader" hidden aria-modal="true" role="dialog" aria-labelledby="rTitle">
  <div class="rbar">
    <button class="back" id="back" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="lbl">Voltar</span>
    </button>
    <div class="rtitle"><strong id="rTitle"></strong><small id="rMeta"></small></div>
    <div class="ractions">
      <button class="btn" id="rOpen" type="button" title="Abrir em nova aba">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        <span class="lbl">Nova aba</span>
      </button>
      <button class="btn" id="rDown" type="button" title="Baixar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span class="lbl">Baixar</span>
      </button>
    </div>
  </div>
  <div class="rbody" id="rBody"></div>
</section>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const KEY_SLOT = "arquivo-chave";
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const FMT = {html:"HTML", pdf:"PDF", pptx:"PPTX", xlsx:"XLSX"};

let key = null, meta = null, catalog = null;
let state = {cat:"todas", q:"", newest:true};
const blobCache = new Map();

/* ---------- armazenamento (pode falhar em modo privado) ---------- */
const store = {
  get(){ for (const s of [sessionStorage, localStorage]) { try { const v = s.getItem(KEY_SLOT); if (v) return v; } catch(e){} } return null; },
  set(v, persist){ try { sessionStorage.setItem(KEY_SLOT, v); } catch(e){} if (persist) { try { localStorage.setItem(KEY_SLOT, v); } catch(e){} } },
  clear(){ for (const s of [sessionStorage, localStorage]) { try { s.removeItem(KEY_SLOT); } catch(e){} } }
};

/* ---------- criptografia ---------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));

async function deriveKey(password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(meta.salt), iterations:meta.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decrypt(buf){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, key, buf.slice(12));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).arrayBuffer();
}
async function fetchBin(name, fresh){
  const r = await fetch("d/" + name + ".bin", {cache: fresh ? "no-cache" : "default"});
  if (!r.ok) throw new Error("http " + r.status);
  return r.arrayBuffer();
}
async function loadCatalog(){
  const raw = await decrypt(await fetchBin("c", true));
  catalog = JSON.parse(new TextDecoder().decode(raw));
}

/* ---------- entrada ---------- */
async function boot(){
  try { meta = await (await fetch("d/meta.json", {cache:"no-cache"})).json(); }
  catch(e){ showGate("Não foi possível carregar o arquivo. Recarregue a página."); return; }
  const saved = store.get();
  if (saved) {
    try {
      key = await crypto.subtle.importKey("raw", b64d(saved), {name:"AES-GCM"}, true, ["decrypt"]);
      await loadCatalog();
      return startApp();
    } catch(e){ store.clear(); key = null; }
  }
  showGate();
}
function showGate(msg){
  $("app").hidden = true; $("reader").hidden = true; $("gate").hidden = false;
  $("err").textContent = msg || "";
  setTimeout(() => $("pw").focus(), 30);
}
$("peek").onclick = () => { const i = $("pw"); i.type = i.type === "password" ? "text" : "password"; i.focus(); };
$("loginForm").onsubmit = async ev => {
  ev.preventDefault();
  const pw = $("pw").value; if (!pw) return;
  $("enter").disabled = true; $("enter").textContent = "Verificando…"; $("err").textContent = "";
  try {
    key = await deriveKey(pw);
    await loadCatalog();
    store.set(b64e(await crypto.subtle.exportKey("raw", key)), $("remember").checked);
    $("pw").value = "";
    startApp();
  } catch(e){
    key = null;
    $("err").textContent = "Senha incorreta.";
    $("pw").select();
  } finally {
    $("enter").disabled = false; $("enter").textContent = "Entrar";
  }
};
$("logout").onclick = () => { store.clear(); key = null; catalog = null; blobCache.forEach(u => URL.revokeObjectURL(u)); blobCache.clear(); location.hash = ""; showGate(); };

/* ---------- lista ---------- */
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const catName = id => (catalog.categorias.find(c => c.id === id) || {}).nome || id;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, a, b) => n + " " + (n === 1 ? a : b);
function fmtLabel(r){
  const f = FMT[r.fmt] || (r.fmt || "").toUpperCase();
  if (r.pag) return f + " · " + r.pag + (r.fmt === "pptx" ? " slides" : (r.pag === 1 ? " página" : " páginas"));
  return f;
}

function startApp(){
  $("gate").hidden = true; $("app").hidden = false;
  document.title = catalog.titulo || "Arquivo de relatórios";
  $("title").textContent = catalog.titulo || "Relatórios";
  const all = catalog.relatorios, ds = all.map(r => r.data).sort();
  const d0 = ds[0], d1 = ds[ds.length - 1];
  const span = d0 && d1 ? (d0.slice(0,7) === d1.slice(0,7) ? MESES[+d0.slice(5,7)-1] + " de " + d0.slice(0,4)
    : MESES[+d0.slice(5,7)-1] + (d0.slice(0,4) !== d1.slice(0,4) ? " de " + d0.slice(0,4) : "") + " a " + MESES[+d1.slice(5,7)-1] + " de " + d1.slice(0,4)) : "";
  $("sub").textContent = plural(all.length, "relatório", "relatórios") + (span ? " · " + span : "");
  renderChips(); render(); route();
}

function filtered(){
  const words = norm(state.q).split(/\s+/).filter(Boolean);
  return catalog.relatorios.filter(r => {
    if (state.cat !== "todas" && r.cat !== state.cat) return false;
    if (!words.length) return true;
    const hay = norm([r.titulo, r.resumo, r.periodo, catName(r.cat), r.nome].join(" "));
    return words.every(w => hay.includes(w));
  }).sort((a, b) => (state.newest ? -1 : 1) * (a.data.localeCompare(b.data) || a.titulo.localeCompare(b.titulo)));
}

function renderChips(){
  const counts = {}; catalog.relatorios.forEach(r => counts[r.cat] = (counts[r.cat] || 0) + 1);
  const items = [{id:"todas", nome:"Todos", n:catalog.relatorios.length}, ...catalog.categorias.map(c => ({...c, n:counts[c.id] || 0}))];
  $("chips").innerHTML = items.filter(c => c.n).map(c =>
    `<button class="chip" type="button" data-cat="${esc(c.id)}" aria-pressed="${c.id === state.cat}">${esc(c.nome)}<span class="n">${c.n}</span></button>`).join("");
}
$("chips").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.cat = b.dataset.cat;
  $("chips").querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
};

function render(){
  const list = filtered();
  const cat = catalog.categorias.find(c => c.id === state.cat);
  const count = state.q ? plural(list.length, "relatório encontrado", "relatórios encontrados") : plural(list.length, "relatório", "relatórios");
  $("desc").textContent = (cat && cat.desc ? cat.desc + " " : "") + count + ".";
  $("sort").innerHTML = (state.newest ? "Mais recentes primeiro" : "Mais antigos primeiro") +
    ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>';
  if (!list.length) {
    $("results").innerHTML = `<div class="empty">Nenhum relatório encontrado${state.q ? " para “" + esc(state.q) + "”" : ""}.<br><button class="btn" type="button" id="reset">Limpar filtros</button></div>`;
    $("reset").onclick = () => { state.q = ""; state.cat = "todas"; $("q").value = ""; syncSearch(); renderChips(); render(); };
    return;
  }
  const groups = [];
  list.forEach(r => { const k = r.data.slice(0,7); let g = groups[groups.length-1]; if (!g || g.k !== k) groups.push(g = {k, items:[]}); g.items.push(r); });
  $("results").innerHTML = groups.map(g => `
    <section>
      <div class="month"><h2>${MESES[+g.k.slice(5,7)-1].replace(/^./, c => c.toUpperCase())} de ${g.k.slice(0,4)}</h2><span>${g.items.length}</span></div>
      <ul class="list">${g.items.map(r => `
        <li class="item"><a href="#/r/${esc(r.id)}">
          <h3>${esc(r.titulo)}</h3>
          ${r.resumo ? `<p>${esc(r.resumo)}</p>` : ""}
          <div class="meta">${esc([state.cat === "todas" ? catName(r.cat) : "", r.periodo, fmtLabel(r)].filter(Boolean).join("  ·  "))}</div>
          <span class="fmt">${esc(FMT[r.fmt] || r.fmt.toUpperCase())}</span>
        </a></li>`).join("")}
      </ul>
    </section>`).join("");
}
$("sort").onclick = () => { state.newest = !state.newest; render(); };
function syncSearch(){ $("clear").hidden = !$("q").value; $("kbd").hidden = !!$("q").value; }
$("q").oninput = () => { state.q = $("q").value; syncSearch(); render(); };
$("clear").onclick = () => { $("q").value = ""; state.q = ""; syncSearch(); render(); $("q").focus(); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && !$("app").hidden && $("reader").hidden && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && !$("reader").hidden) closeReader();
});

/* ---------- leitor ---------- */
let current = null, cameFromList = false;
window.addEventListener("hashchange", () => { cameFromList = true; route(); });
function route(){
  if (!catalog) return;
  const m = location.hash.match(/^#\/r\/([\w-]+)/);
  const r = m && catalog.relatorios.find(x => x.id === m[1]);
  if (r) openReader(r); else hideReader();
}
function closeReader(){ if (cameFromList && history.length > 1) history.back(); else { location.hash = ""; } }
$("back").onclick = closeReader;
window.addEventListener("message", e => { if (e.data === "arquivo:fechar" && !$("reader").hidden) closeReader(); });

async function getBlob(part){
  if (blobCache.has(part.f)) return blobCache.get(part.f);
  const raw = await decrypt(await fetchBin(part.f));
  const url = URL.createObjectURL(new Blob([raw], {type: part.mime}));
  blobCache.set(part.f, url);
  return url;
}
function stateBox(html){ $("rBody").innerHTML = `<div class="state"><div>${html}</div></div>`; }

const IFRAME_GUARD = `<script>(function(){try{window.localStorage}catch(e){var m={},s={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null},get length(){return Object.keys(m).length}};try{Object.defineProperty(window,"localStorage",{value:s});Object.defineProperty(window,"sessionStorage",{value:s})}catch(e){}}["pushState","replaceState"].forEach(function(n){var f=history[n];history[n]=function(){try{return f.apply(history,arguments)}catch(e){}}});document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href")||"";if(h&&h.charAt(0)!=="#"&&h.indexOf("javascript:")!==0){a.target="_blank";a.rel="noopener"}},true);document.addEventListener("keydown",function(e){if(e.key==="Escape")parent.postMessage("arquivo:fechar","*")})})();<\/script>`;

function canInlinePdf(){
  const small = matchMedia("(pointer:coarse)").matches && innerWidth < 900;
  return navigator.pdfViewerEnabled !== false && !small;
}

async function openReader(r){
  current = r;
  document.body.classList.add("locked");
  $("reader").hidden = false;
  $("rTitle").textContent = r.titulo;
  document.title = r.titulo;
  $("rMeta").textContent = [catName(r.cat), r.periodo, fmtLabel(r)].filter(Boolean).join(" · ");
  $("rOpen").hidden = !r.ver;
  $("rDown").querySelector(".lbl").textContent = r.fmt === "pptx" ? "Baixar PPTX" : "Baixar";
  stateBox(`<div class="spin"></div>Abrindo${r.tam > 1.5e6 ? " (" + (r.tam/1e6).toFixed(1).replace(".", ",") + " MB)" : ""}…`);
  try {
    if (!r.ver) { stateBox(`<h2>Arquivo para baixar</h2><p>Este arquivo não tem visualização no navegador.</p><div class="row"><button class="btn" data-act="down">Baixar</button></div>`); return; }
    if (r.ver.mime === "text/html") {
      const raw = await decrypt(await fetchBin(r.ver.f));
      if (current !== r) return;
      let html = new TextDecoder().decode(raw);
      html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + IFRAME_GUARD) : IFRAME_GUARD + html;
      const fr = document.createElement("iframe");
      fr.title = r.titulo;
      fr.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads allow-forms allow-modals");
      fr.srcdoc = html;
      $("rBody").replaceChildren(fr);
    } else if (r.ver.mime === "application/pdf" && canInlinePdf()) {
      const url = await getBlob(r.ver);
      if (current !== r) return;
      const fr = document.createElement("iframe");
      fr.title = r.titulo; fr.src = url + "#view=FitH";
      $("rBody").replaceChildren(fr);
    } else {
      await getBlob(r.ver);
      if (current !== r) return;
      stateBox(`<h2>${esc(r.titulo)}</h2><p>${esc(fmtLabel(r))}</p><div class="row"><button class="btn btn-primary" style="width:auto" data-act="open">Abrir PDF</button><button class="btn" data-act="down">Baixar</button></div>`);
    }
  } catch(e){
    if (current !== r) return;
    stateBox(`<h2>Não foi possível abrir</h2><p>Verifique a conexão e tente de novo.</p><div class="row"><button class="btn" data-act="retry">Tentar de novo</button></div>`);
  }
}
$("rBody").onclick = e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "open") openNewTab(); else if (act === "down") download(); else if (act === "retry" && current) openReader(current);
};
function hideReader(){
  current = null;
  $("reader").hidden = true; $("rBody").replaceChildren();
  document.body.classList.remove("locked");
  if (catalog) document.title = catalog.titulo || "Arquivo de relatórios";
}
async function openNewTab(){
  if (!current || !current.ver) return;
  const w = window.open("", "_blank");
  try { const url = await getBlob(current.ver); if (w) w.location.href = url; else location.href = url; }
  catch(e){ if (w) w.close(); }
}
async function download(){
  if (!current) return;
  const part = current.baixar || current.ver;
  try {
    const url = await getBlob(part);
    const a = document.createElement("a");
    a.href = url; a.download = part === current.ver && current.fmt === "pptx" ? current.nome.replace(/\.pptx$/i, ".pdf") : current.nome;
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e){}
}
$("rOpen").onclick = openNewTab;
$("rDown").onclick = download;

if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
  showGate("Este navegador não é compatível. Use uma versão recente de Chrome, Safari, Edge ou Firefox.");
} else boot();
})();
</script>
